<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f2c5c" />
  <title>10월 매장품질 고객경험 R/P | 강북연구소</title>
  <style>
    :root {
      --navy:#0f2c5c;
      --blue:#1769d2;
      --sky:#eaf4ff;
      --teal:#0b8f8c;
      --teal-soft:#e9fbf8;
      --violet:#6e4bd8;
      --violet-soft:#f3efff;
      --orange:#f28b19;
      --orange-soft:#fff6e9;
      --pink:#e83d87;
      --pink-soft:#fff0f6;
      --ink:#152033;
      --sub:#566176;
      --line:#dfe7f1;
      --card:#ffffff;
      --page:#f4f7fb;
      --shadow:0 12px 35px rgba(15,44,92,.08);
      --radius:22px;
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      font-family: "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top left, rgba(23,105,210,.10), transparent 34%),
        radial-gradient(circle at top right, rgba(11,143,140,.08), transparent 30%),
        var(--page);
      line-height:1.55;
      letter-spacing:-.02em;
    }
